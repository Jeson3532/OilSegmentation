    <style>
        /* Стили для таблицы */
        .table-container {
            width: 100%;
            height: 100%;
            padding: 40px;
            overflow: auto;
        }

        .incidents-table {
            width: 100%;
            border-collapse: collapse;
            background: #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .incidents-table th {
            background: #333;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #444;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .incidents-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #444;
            color: #e0e0e0;
            font-size: 14px;
        }

        .incidents-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .incidents-table tr:last-child td {
            border-bottom: none;
        }

        .photo-cell img {
            max-width: 120px;
            max-height: 80px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #555;
        }

        .table-header {
            color: white;
            font-size: 32px;
            margin-bottom: 30px;
            text-align: center;
            font-family: 'Mozilla Headline', sans-serif;
        }

        .no-data {
            text-align: center;
            color: #888;
            padding: 40px;
            font-style: italic;
        }

        /* Адаптивность для мобильных */
        @media (max-width: 775px) {
            .table-container {
                padding: 20px;
            }
            
            .incidents-table {
                font-size: 12px;
            }
            
            .incidents-table th,
            .incidents-table td {
                padding: 8px 10px;
            }
            
            .photo-cell img {
                max-width: 80px;
                max-height: 60px;
            }
            
            .table-header {
                font-size: 24px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>

        // Функция для заполнения таблицы
        function populateTable(data) {
            const tableBody = document.getElementById('tableBody');
            
            if (!data || data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="no-data">Нет данных для отображения</td></tr>';
                return;
            }
            
            tableBody.innerHTML = '';
            
            data.forEach(incident => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${incident.месторождение}</td>
                    <td>${incident.координаты}</td>
                    <td>${incident['дата инцидента']}</td>
                    <td>${incident['масштаб розлива']}</td>
                    </td>
                `;
                
                tableBody.appendChild(row);
            });
        }

        // Функция для загрузки данных с API (заглушка)
        function loadDataFromAPI() {
            // В будущем здесь будет fetch запрос к API
            // fetch('/api/incidents')

            //         console.error('Ошибка загрузки данных:', error);
            //         populateTable([]);
            //     });
            
            // Пока используем заглушку
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve(mockData);
                }, 500);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadDataFromAPI().then(data => {
                populateTable(data);
            });
        });

        window.updateIncidentsTable = function(newData) {
            populateTable(newData);
        };
    </script>
